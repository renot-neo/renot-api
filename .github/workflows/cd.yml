name: CD

# Builds the `runtime` target from docker/Dockerfile and publishes it to
# GHCR (GitHub Container Registry) - the public repo's only CD
# responsibility. Deliberately does NOT run Alembic migrations, touch any
# real database, or deploy anywhere - a real production target needs real
# credentials, which don't belong in a public, contributor-editable
# workflow file. See private/PUBLIC_RELEASE_ROADMAP.md section 2.
#
# Two triggers, two jobs:
# - push to `main` -> `build-and-push` (amd64 only, tags `latest`+sha) -
#   fast, runs on every commit.
# - push of a `v*` tag (created by release-please.yml merging its release
#   PR) -> `build-and-push-tagged` (amd64+arm64 via QEMU/Buildx, tags the
#   image with the version) - these are the builds the public actually
#   pulls, so they're worth the multi-arch build's extra time. Regular
#   main pushes stay amd64-only for fast iteration. See
#   release-please.yml's own comment for why the tag chain needs a PAT.
#
# Every published image also gets an SBOM (native buildx feature) and a
# GitHub Artifact Attestation (Sigstore-based build provenance, verifiable
# via `gh attestation verify ghcr.io/renot-neo/renot-api:<tag>`) - see
# private/PUBLIC_RELEASE_ROADMAP.md section 16.

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: ghcr.io/renot-neo/renot-api

jobs:
  build-and-push:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-and-push-tagged:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: CD

# Builds the `runtime` target from docker/Dockerfile and publishes it to
# GHCR (GitHub Container Registry) - the public repo's only CD
# responsibility. Deliberately does NOT run Alembic migrations, touch any
# real database, or deploy anywhere - a real production target needs real
# credentials, which don't belong in a public, contributor-editable
# workflow file. See private/PUBLIC_RELEASE_ROADMAP.md section 2.
#
# Two triggers, two jobs:
# - push to `main` -> `build-and-push` (amd64 only, tags `latest`+sha) -
#   fast, runs on every commit.
# - push of a `v*` tag (created by release-please.yml merging its release
#   PR) -> `build-and-push-tagged` (tags the image with the version) -
#   these are the builds the public actually pulls. See
#   release-please.yml's own comment for why that chain needs a PAT.

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: ghcr.io/renot-neo/renot-api

jobs:
  build-and-push:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  build-and-push-tagged:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

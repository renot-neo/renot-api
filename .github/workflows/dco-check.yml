name: DCO Check

# Every commit must carry a `Signed-off-by` trailer (the Developer
# Certificate of Origin - see CONTRIBUTING.md). Implemented as a plain
# shell script over `git log`, not a third-party marketplace Action or
# GitHub App - no third-party code runs here beyond the official
# actions/checkout.

on:
  pull_request:

jobs:
  dco-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all commits are signed off
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            author_email=$(git log -1 --format=%ae "$sha")
            if [[ "$author_email" == *"[bot]@users.noreply.github.com" ]]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer. Run 'git commit --amend -s' (or 'git rebase --signoff $BASE') and force-push."
              MISSING=1
            fi
          done
          exit $MISSING

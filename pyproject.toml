[project]
name = "renot-api"
version = "0.3.0"
description = "A multi-tenant B2B SaaS platform for centralized Telegram bot management."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)`/etc. are FastAPI idioms (a marker, evaluated
# per-request by FastAPI, not an actual mutable default) - B008 false
# positive for this pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Minimal strict disallow_untyped_defs at the service & core layers
[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.modules.*.service"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
# The default C tracer loses lines executed across a `greenlet` context
# switch (SQLAlchemy's async engine bridges its fundamentally-sync Core/ORM
# internals to asyncio via `greenlet_spawn`) - router code that merely
# calls `await session.commit()`/does an ORM query
# was showing as "uncovered" even when a passing test demonstrably executed
# it end-to-end (verified via `tests/integration`), because coverage's
# legacy tracer doesn't see across that switch. `sysmon` (Python 3.12+
# `sys.monitoring`, coverage.py >= 7.4) traces correctly through greenlet
# switches - this is a measurement fix, not a test-coverage change.
core = "sysmon"

[tool.coverage.report]
fail_under = 95

[project]
name = "renot-api"
version = "0.5.0"
description = "A multi-tenant B2B SaaS platform for centralized Telegram bot management."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)`/etc. are FastAPI idioms (a marker, evaluated
# per-request by FastAPI, not an actual mutable default) - B008 false
# positive for this pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Minimal strict disallow_untyped_defs at the service & core layers
[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.modules.*.service"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Two known, harmless DeprecationWarnings from inside `passlib` itself
    # (not our code - confirmed by grepping app/ for both symbols and
    # reading passlib's own source). passlib 1.7.4 is both the installed
    # AND the latest version on PyPI (last released 2020, effectively
    # unmaintained) - there is no newer release that fixes either one, so
    # these can't be resolved by upgrading. Narrowly scoped to the exact
    # message + source module (not a blanket DeprecationWarning ignore) so
    # an unrelated new warning still surfaces normally.
    # 1. passlib/utils/__init__.py: imports stdlib `crypt` as an optional
    #    fallback backend - `crypt` itself is what's deprecated (PEP 594),
    #    passlib just imports it unconditionally at module load time.
    "ignore:'crypt' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:passlib\\.utils",
    # 2. passlib/handlers/argon2.py: reads `argon2_cffi.__version__` for a
    #    debug log line - argon2-cffi (currently the latest, 25.1.0) has
    #    deprecated that attribute in favor of `importlib.metadata`, but
    #    passlib was never updated to follow (no newer passlib exists).
    "ignore:Accessing argon2\\.__version__ is deprecated.*:DeprecationWarning:passlib\\.handlers\\.argon2",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
# The default C tracer loses lines executed across a `greenlet` context
# switch (SQLAlchemy's async engine bridges its fundamentally-sync Core/ORM
# internals to asyncio via `greenlet_spawn`) - router code that merely
# calls `await session.commit()`/does an ORM query
# was showing as "uncovered" even when a passing test demonstrably executed
# it end-to-end (verified via `tests/integration`), because coverage's
# legacy tracer doesn't see across that switch. `sysmon` (Python 3.12+
# `sys.monitoring`, coverage.py >= 7.4) traces correctly through greenlet
# switches - this is a measurement fix, not a test-coverage change.
core = "sysmon"

[tool.coverage.report]
fail_under = 95
